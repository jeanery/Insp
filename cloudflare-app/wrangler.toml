name = "sig-uhe"
main = "worker/index.ts"
compatibility_date = "2026-10-14"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sig-uhe"
database_id = "f51b527d-caa8-4225-a0d5-8db06af3ea02"
migrations_dir = "migrations"

# Identidade verificada pelo Worker existente; não copiar AUTH_SECRET ou banco SIGA.
[[services]]
binding = "SIGA"
service = "siga-ccu"
