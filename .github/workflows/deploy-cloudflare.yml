name: Publicar SIG-UHE na Cloudflare
on:
  workflow_dispatch:
    inputs:
      database_id:
        description: Opcional — deixe vazio para criar/localizar automaticamente o D1 sig-uhe
        required: false
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Configurar Cloudflare e o banco exclusivo do SIG-UHE
        env:
          SIG_UHE_D1_ID: ${{ inputs.database_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run configure:cloudflare
      - name: Validar destino, migrar D1 e publicar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
