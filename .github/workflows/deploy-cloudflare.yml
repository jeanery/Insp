name: Publicar SIG-UHE na Cloudflare
on:
  workflow_dispatch:
    inputs:
      database_id:
        description: ID do D1 exclusivo sig-uhe (não use o banco do SIGA-CCU)
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: cloudflare-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Configurar o banco exclusivo do SIG-UHE
        env:
          SIG_UHE_D1_ID: ${{ inputs.database_id }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          value = os.environ['SIG_UHE_D1_ID']
          if not re.fullmatch(r'[a-fA-F0-9]{8}(?:-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}', value):
              raise SystemExit('ID do D1 inválido')
          p = Path('wrangler.toml')
          p.write_text(p.read_text().replace('00000000-0000-0000-0000-000000000000', value))
          PY
      - name: Validar destino, migrar D1 e publicar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
